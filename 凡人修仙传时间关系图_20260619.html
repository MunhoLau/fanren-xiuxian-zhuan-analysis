<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline CSS Layout</title>
    <style>
        body { margin: 0; background: #0d0d0d; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container {
            position: relative; width: 1200px; height: 450px; background: #0d0d0d; 
            font-family: Arial, sans-serif; color: white; box-sizing: border-box; overflow: hidden;
        }
        /* 垂直线 */
        .v-line { position: absolute; top: 80px; bottom: 140px; width: 0; border-left: 2px solid white; }
        .v-line-1 { left: 50px; }
        .v-line-2 { left: 480px; }
        .v-line-3 { left: 580px; }
        .v-line-4 { left: 820px; }
        
        /* 文字标签 */
        .label { position: absolute; text-align: center; font-size: 14px; }
        .label-t1 { left: 50px; top: 240px; transform: translateX(-50%); }
        .label-t2 { left: 480px; top: 240px; transform: translateX(-50%); }
        .label-t2-1 { left: 580px; top: 235px; transform: translateX(-50%); }
        .label-t2-2 { left: 580px; top: 255px; transform: translateX(-50%); font-size: 12px; }
        .label-t3-1 { left: 820px; top: 235px; transform: translateX(-50%); }
        .label-t3-2 { left: 820px; top: 255px; transform: translateX(-50%); font-size: 12px; }

        /* 横线 */
        .h-line { position: absolute; height: 0; border-top: 2px solid; }
        .h-line-1 { top: 130px; left: 50px; width: 1100px; border-color: white; }
        .h-line-2 { top: 160px; left: 480px; width: 340px; border-color: #ff6b6b; border-style: dashed; }
        .h-line-3 { top: 180px; left: 480px; width: 340px; border-color: #ff6b6b; }
        .h-line-4 { top: 200px; left: 480px; width: 470px; border-color: #1e90ff; }
        .h-line-5 { top: 220px; left: 480px; width: 420px; border-color: #1e90ff; border-style: dashed; }
        .h-line-6 { top: 240px; left: 580px; width: 570px; border-color: #e69138; }

        /* 虚线路径 */
        .dashed-line { position: absolute; border-color: #ff6b6b; border-style: dashed; border-width: 0; }
        .path-red-1 { top: 60px; left: 50px; width: 770px; border-top: 2px dashed #ff6b6b; }
        .path-red-2 { top: 60px; left: 820px; height: 40px; border-left: 2px dashed #ff6b6b; }
        .path-blue-1 { top: 230px; left: 780px; height: 80px; border-left: 2px dashed #1e90ff; }
        .path-blue-2 { top: 260px; left: 580px; height: 90px; border-left: 2px dashed #1e90ff; }
        
        /* 文字框 */
        .box { position: absolute; border: 2px solid; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 13px; }
        .box-back { left: 730px; top: 295px; width: 100px; height: 30px; border-color: #1e90ff; }
        .box-past { left: 530px; top: 335px; width: 100px; height: 30px; border-color: #1e90ff; }
        .box-hide { left: 900px; top: 190px; width: 110px; height: 20px; border-color: #1e90ff; }
        .box-fly { left: 1010px; top: 210px; width: 90px; height: 20px; border-color: #e69138; color: #e69138; }
        .box-future { left: 1120px; top: 235px; width: 60px; height: 30px; border-color: white; }

        /* 图例 */
        .legend { position: absolute; left: 20px; bottom: 30px; width: 250px; height: 150px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; padding: 15px; box-sizing: border-box; font-size: 13px; color: #eeeeee; }
        .legend-title { margin-bottom: 10px; font-size: 13px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        .legend-line { display: inline-block; width: 50px; height: 0; border-top: 2px solid; margin-right: 10px; }
        .legend-line.dash { border-style: dashed; }
        .legend-line.white { border-color: white; }
        .legend-line.red { border-color: #ff6b6b; }
        .legend-line.blue { border-color: #1e90ff; }
        .legend-line.orange { border-color: #e69138; }
    </style>
</head>
<body>
<div class="container">
    <!-- 纵向时间线 -->
    <div class="v-line v-line-1"></div>
    <div class="v-line v-line-2"></div>
    <div class="v-line v-line-3"></div>
    <div class="v-line v-line-4"></div>

    <!-- 文字标签 -->
    <div class="label label-t1">远古</div>
    <div class="label label-t2">故事开端</div>
    <div class="label label-t2-1">墨彩环转世</div>
    <div class="label label-t2-2">厉飞雨转世</div>
    <div class="label label-t3-1">古或今</div>
    <div class="label label-t3-2">被击败</div>

    <!-- 横向时间线 -->
    <div class="h-line h-line-1"></div>
    <div class="h-line h-line-2"></div>
    <div class="h-line h-line-3"></div>
    <div class="h-line h-line-4"></div>
    <div class="h-line h-line-5"></div>
    <div class="h-line h-line-6"></div>

    <!-- 虚线回溯 -->
    <div class="dashed-line path-red-1"></div>
    <div class="dashed-line path-red-2"></div>
    <div class="dashed-line path-blue-1"></div>
    <div class="dashed-line path-blue-2"></div>

    <!-- 信息框 -->
    <div class="box box-back">回到现实 ▸</div>
    <div class="box box-past">◂ 回溯过去</div>
    <div class="box box-hide">韩立等人隐居</div>
    <div class="box box-fly">厉飞羽飞升</div>
    <div class="box box-future">未来</div>

    <!-- 图例 -->
    <div class="legend">
        <div class="legend-title">Frame</div>
        <div class="legend-item"><span class="legend-line white"></span> 唯一时间线</div>
        <div class="legend-item"><span class="legend-line red dash"></span> A韩立时间道祖时间线</div>
        <div class="legend-item"><span class="legend-line red"></span> A韩立轮回道祖时间线</div>
        <div class="legend-item"><span class="legend-line blue"></span> B韩立成长时间线</div>
        <div class="legend-item"><span class="legend-line blue dash"></span> B韩立时间道祖时间线</div>
        <div class="legend-item"><span class="legend-line orange"></span> 厉飞雨时间线(厉飞雨转世)</div>
    </div>
</div>
</body>
</html>
